<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEME-OS ULTRA | Advanced Builder</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        :root { --p: #00ffa3; --bg: #0d1117; --s: #161b22; --border: #30363d; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #c9d1d9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 420px; background: var(--s); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        .tab { padding: 20px; border-bottom: 1px solid var(--border); }
        .tool-title { font-size: 0.7rem; color: var(--p); font-weight: 900; letter-spacing: 1.5px; margin-bottom: 15px; display: block; }
        input, textarea { width: 100%; background: #010409; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.8rem; box-sizing: border-box; }
        .btn-add { background: transparent; border: 1px solid var(--p); color: var(--p); padding: 5px 10px; font-size: 0.7rem; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
        .preview-zone { flex-grow: 1; background: #010409; display: flex; flex-direction: column; position: relative; }
        #web-canvas { width: 90%; max-width: 900px; margin: 20px auto; background: #fff; flex-grow: 1; border-radius: 15px; overflow-y: auto; box-shadow: 0 40px 100px rgba(0,0,0,0.5); background-size: cover !important; }
        .btn-p { background: var(--p); color: #000; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--s); padding: 40px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="auth-modal">
        <div class="auth-card">
            <h2 style="color:var(--p)">MEME-OS LOGIN</h2>
            <input type="text" id="userId" placeholder="Developer Name">
            <button class="btn-p" style="margin-top:15px" onclick="login()">START BUILDING</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="tab" style="background:#000"><h2 style="color:var(--p);margin:0">MEME-OS ULTRA</h2></div>
        
        <div class="tab">
            <span class="tool-title">1. BRANDING</span>
            <input type="text" id="cName" value="PEPE GOLD" oninput="render()">
            <input type="file" id="logoInp" onchange="handleImg(this, 'logo')">
            <input type="file" id="bgInp" onchange="handleImg(this, 'bg')">
        </div>

        <div class="tab">
            <span class="tool-title">2. CONTRACT ADDRESS</span>
            <input type="text" id="cCA" placeholder="Paste CA Here" oninput="render()">
        </div>

        <div class="tab" id="token-inputs">
            <span class="tool-title">3. TOKENOMICS</span>
            <div class="t-row"><input type="text" class="t-val" value="Total Supply: 1 Billion" oninput="render()"></div>
            <div class="t-row"><input type="text" class="t-val" value="LP: 100% Burned" oninput="render()"></div>
            <button class="btn-add" onclick="addInput('token-inputs', 'New Tokenomics Point')">+ ADD MORE</button>
        </div>

        <div class="tab" id="roadmap-inputs">
            <span class="tool-title">4. ROADMAP</span>
            <div class="r-row"><input type="text" class="r-val" value="Phase 1: Launch" oninput="render()"></div>
            <div class="r-row"><input type="text" class="r-val" value="Phase 2: Dex Update" oninput="render()"></div>
            <button class="btn-add" onclick="addInput('roadmap-inputs', 'New Roadmap Phase')">+ ADD MORE</button>
        </div>

        <div style="padding:20px"><button class="btn-p" onclick="pay()">DEPLOY & DOWNLOAD (0.05 SOL)</button></div>
    </div>

    <div class="preview-zone">
        <div id="web-canvas"><div id="render-target"></div></div>
    </div>

    <script>
        let logo = "", bg = "";
        function login() { document.getElementById('auth-modal').style.display='none'; render(); }
        
        function addInput(parentId, placeholder) {
            const div = document.createElement('div');
            const cls = parentId === 'token-inputs' ? 't-val' : 'r-val';
            div.innerHTML = `<input type="text" class="${cls}" placeholder="${placeholder}" oninput="render()">`;
            document.getElementById(parentId).insertBefore(div, document.getElementById(parentId).lastElementChild);
            render();
        }

        function handleImg(input, type) {
            const reader = new FileReader();
            reader.onload = (e) => { if(type==='logo') logo=e.target.result; else bg=e.target.result; render(); };
            reader.readAsDataURL(input.files[0]);
        }

        function render() {
            const canvas = document.getElementById('web-canvas');
            if(bg) canvas.style.background = `url(${bg})`;
            
            const tokens = Array.from(document.querySelectorAll('.t-val')).map(i => `<div style="padding:10px; border-bottom:1px solid rgba(255,255,255,0.1)">${i.value}</div>`).join('');
            const roadmaps = Array.from(document.querySelectorAll('.r-val')).map(i => `<div style="padding:10px; border-left:3px solid var(--p); margin-bottom:10px; background:rgba(255,255,255,0.05)">${i.value}</div>`).join('');

            document.getElementById('render-target').innerHTML = `
                <div style="background:rgba(0,0,0,0.8); min-height:100%; color:#fff; backdrop-filter:blur(10px); padding:40px; text-align:center;">
                    <img src="${logo || 'https://via.placeholder.com/100'}" style="width:120px; border-radius:50%; border:3px solid var(--p)">
                    <h1 style="font-size:3.5rem; margin:10px 0;">${document.getElementById('cName').value}</h1>
                    
                    <div style="margin:30px 0; background:#00ffa3; color:#000; padding:15px; border-radius:10px; font-weight:bold; font-family:monospace; font-size:1.1rem; box-shadow: 0 0 20px var(--p)">
                        CONTRACT: ${document.getElementById('cCA').value || 'TBA'}
                    </div>

                    <div style="text-align:left; max-width:600px; margin:auto;">
                        <h2 style="color:var(--p); border-bottom:1px solid var(--p); padding-bottom:10px;">TOKENOMICS</h2>
                        <div style="margin-bottom:40px;">${tokens}</div>

                        <h2 style="color:var(--p); border-bottom:1px solid var(--p); padding-bottom:10px;">ROADMAP</h2>
                        <div>${roadmaps}</div>
                    </div>
                    
                    <button style="margin-top:40px; background:var(--p); padding:15px 40px; border:none; border-radius:50px; font-weight:bold; font-size:1.2rem;">BUY ON PUMP.FUN</button>
                </div>
            `;
        }

        async function pay() {
            alert("Payment of 0.05 SOL triggered... (Blockchain Simulation)");
            // Add real solanaWeb3 payment logic here as per previous step
            download();
        }

        function download() {
            const content = document.getElementById('render-target').innerHTML;
            const style = `<style>:root{--p:#00ffa3;}body{margin:0;background:#000;font-family:sans-serif;}</style>`;
            const blob = new Blob([`<html><head>${style}</head><body>${content}</body></html>`], {type:'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "index.html";
            a.click();
        }
    </script>
</body>
</html>
